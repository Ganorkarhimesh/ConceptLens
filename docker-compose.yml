services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DEMO_MODE: "true"

  frontend:
    build:
      context: .
      dockerfile: artifacts/conceptlens-ai/Dockerfile
    ports:
      - "5173:5173"
    environment:
      PORT: "5173"
      BASE_PATH: "/"
    depends_on:
      - backend