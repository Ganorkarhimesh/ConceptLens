kind = "web"
previewPath = "/"
title = "ConceptLens AI"
description = "An education diagnostic app that identifies the reasoning behind incorrect math answers, then guides students through targeted recovery and reassessment."
version = "1.0.0"
id = "artifacts/conceptlens-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20322

[services.development]
run = "pnpm --filter @workspace/conceptlens-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/conceptlens-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/conceptlens-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20322"
BASE_PATH = "/"
